    <script>
        (function () {
            var nativeH = null;
            try {
                var d = Object.getOwnPropertyDescriptor(window, 'innerHeight') || Object.getOwnPropertyDescriptor(Window.prototype, 'innerHeight');
                if (d && d.get) {
                    nativeH = d.get.bind(window);
                    Object.defineProperty(window, 'innerHeight', {
                        configurable: true,
                        get: function () { var b = document.body, h = b ? b.clientHeight : 0; return h > 0 ? h : nativeH(); }
                    });
                }
            } catch (e) { }
            var root = document.documentElement, lastH = 0;
            var measure = function () {
                var vv = window.visualViewport, c = [root.clientHeight, nativeH ? nativeH() : 0, vv ? vv.height * vv.scale : 0], h = 0;
                for (var i = 0; i < c.length; i++) if (c[i] > 0 && (!h || c[i] < h)) h = c[i];
                h = Math.round(h);
                if (!h || Math.abs(h - lastH) < 2) return;
                var first = !lastH;
                lastH = h;
                root.style.setProperty('--app-h', h + 'px');
                if (!first) { try { window.dispatchEvent(new Event('resize')); } catch (e) { } }
            };
            measure();
            ['resize', 'orientationchange', 'pageshow', 'load'].forEach(function (t) { window.addEventListener(t, measure); });
            document.addEventListener('DOMContentLoaded', measure);
            if (window.visualViewport) window.visualViewport.addEventListener('resize', measure);
            setInterval(measure, 400);
        })();
    </script>
